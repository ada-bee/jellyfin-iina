name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

      - name: Create plugin archive
        run: |
          zip -r ../xyz.brbc.jellyfin.iinaplugin.iinaplgz .
        working-directory: xyz.brbc.jellyfin.iinaplugin

      - name: Verify archive
        run: |
          unzip -t xyz.brbc.jellyfin.iinaplugin.iinaplgz
