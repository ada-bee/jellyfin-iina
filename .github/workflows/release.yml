name: Prepare release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (for example v3.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release metadata and IINA update source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          previous_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          bun run verify:release "$RELEASE_TAG" "$previous_tag"

      - name: Verify source archive, committed bundles, and release package
        run: bun run ci

      - name: Create a draft with the verified archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG" xyz.brbc.jellyfin.iinaplugin.iinaplgz
          --repo "$GITHUB_REPOSITORY" --verify-tag --draft
          --title "$RELEASE_TAG" --generate-notes
