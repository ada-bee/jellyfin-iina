name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify source archive, committed bundles, and release package
        run: bun run ci

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: xyz.brbc.jellyfin.iinaplugin.iinaplgz
          token: ${{ github.token }}
