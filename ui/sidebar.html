<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="sidebar.css">
</head>
<body>
    <div id="login-view" class="view">
        <div class="login-container">
            <div class="login-brand">
                <img class="login-logo" src="assets/jellyfin-icon.png" alt="">
                <h1>Jellyfin</h1>
                <p>Connect to your media server</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="server-url">Server</label>
                    <input type="url" id="server-url" placeholder="https://jellyfin.example.com" autocomplete="url" required>
                </div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary" id="connect-btn">Connect</button>
                <div id="login-error" class="error-message" role="alert"></div>
            </form>
        </div>
        <div class="legal-note">
            Not affiliated with the Jellyfin Project.<br>
            Jellyfin logos licensed under CC-BY-SA 4.0.
        </div>
    </div>

    <div id="browse-view" class="view hidden">
        <nav id="navigation-layer" class="navigation-layer hidden" aria-label="Jellyfin navigation">
            <div id="section-header" class="section-header hidden">
                <button id="back-btn" class="back-button hidden" data-clickable type="button" title="Back" aria-label="Back">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                        <path d="m11.5 3.5-5 5.5 5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span id="section-title"></span>
                </button>
            </div>
        </nav>

        <main id="content" class="content"></main>

        <div id="loading" class="loading hidden" aria-label="Loading">
            <div class="skeleton-card"><div class="skeleton-artwork"></div><div class="skeleton-line skeleton-line--title"></div><div class="skeleton-line"></div></div>
            <div class="skeleton-card"><div class="skeleton-artwork"></div><div class="skeleton-line skeleton-line--title"></div><div class="skeleton-line"></div></div>
        </div>

        <div id="error-state" class="feedback-state hidden">
            <svg class="feedback-icon" width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
                <path d="M17 3.5 31 28H3L17 3.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M17 11v8m0 4v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <h3>Couldn’t Load Content</h3>
            <p id="error-message"></p>
            <button id="retry-btn" class="btn-secondary" data-clickable type="button">Try Again</button>
        </div>

        <div id="bottom-search-layer" class="bottom-search-layer">
            <div id="search-filters" class="scope-control hidden" role="group" aria-label="Filter results">
                <button type="button" data-search-filter="all" aria-pressed="true">All</button>
                <button type="button" data-search-filter="movie" aria-pressed="false">Movies</button>
                <button type="button" data-search-filter="series" aria-pressed="false">Series</button>
                <button type="button" data-search-filter="episode" aria-pressed="false">Episodes</button>
            </div>
            <div class="search-field" role="search">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
                    <path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <input type="search" id="search-input" aria-label="Search" placeholder="Search ..." autocomplete="off" spellcheck="false">
                <button id="clear-search" class="clear-search hidden" data-clickable type="button" title="Clear search" aria-label="Clear search">
                    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                        <circle cx="9" cy="9" r="8" fill="currentColor" opacity=".28"/>
                        <path d="m6.5 6.5 5 5m0-5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script src="dist/sidebar.js"></script>
</body>
</html>
